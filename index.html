<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>axstiz</title>
  <link rel="icon" href="https://github.com/axstiz.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="layout">
    <main class="content">
      <section class="glass-card hero" id="about">
        <div class="hero-avatar">
          <img id="avatar-main" src="" alt="avatar">
        </div>
        <div class="hero-info">
          <h1 id="hero-name"></h1>
          <div class="hero-handle" id="hero-nick"></div>
          <div class="hero-title" id="hero-title"></div>
          <div class="hero-meta" id="hero-meta"></div>
          <p class="hero-desc" id="hero-desc"></p>
        </div>
      </section>

      <section class="glass-card" id="stack">
        <h2 class="section-title">Стек</h2>
        <div id="stack-list"></div>
      </section>

      <section class="glass-card" id="skills">
        <h2 class="section-title">Ключевые навыки</h2>
        <div class="chips" id="skills-list"></div>
      </section>

      <section class="glass-card" id="projects">
        <h2 class="section-title">Проекты</h2>
        <div id="projects-list"></div>
      </section>

      <section class="glass-card" id="education">
        <h2 class="section-title">Образование</h2>
        <div id="education-list"></div>
      </section>
    </main>

    <aside class="side-panel">
      <div class="panel-avatar">
        <img id="avatar-side" src="" alt="avatar">
      </div>
      <div class="panel-name" id="panel-name"></div>
      <div class="panel-nick" id="panel-nick"></div>
      <div class="panel-block">
        <div class="panel-heading">Соцсети</div>
        <div class="socials" id="socials-list"></div>
      </div>
      <div class="panel-block">
        <div class="panel-heading">Контакты</div>
        <div class="contacts" id="contacts-list"></div>
      </div>
      <div class="panel-foot" id="panel-foot"></div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
